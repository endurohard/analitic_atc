version: '3.8'

services:
  # Локальная PostgreSQL база для аутентификации и настроек
  local_db:
    image: postgres:15-alpine
    container_name: atc_analytics_local_db
    environment:
      - POSTGRES_USER=atc_local
      - POSTGRES_PASSWORD=atc_local_password
      - POSTGRES_DB=atc_local
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
      - ./backend/init_local_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - atc_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atc_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Frontend - React приложение
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atc_analytics_frontend
    ports:
      - "3002:3001"
    environment:
      - REACT_APP_API_URL=http://localhost:8001
      - PUBLIC_URL=
      - PORT=3001
      - HOST=0.0.0.0
      - WATCHPACK_POLLING=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
      - WDS_SOCKET_PORT=3002
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - atc_network
      - infobotit_bot_app_net
    restart: unless-stopped

  # Backend - FastAPI приложение
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atc_analytics_backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - LOCAL_DATABASE_URL=postgresql://atc_local:atc_local_password@local_db:5432/atc_local
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      local_db:
        condition: service_healthy
    networks:
      - atc_network
      - infobotit_bot_app_net
    restart: unless-stopped

  # PostgreSQL - база данных (закомментировано, используем внешнюю БД)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: atc_analytics_db
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - POSTGRES_DB=${POSTGRES_DB}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./database_schema.sql:/docker-entrypoint-initdb.d/schema.sql
  #   networks:
  #     - atc_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

networks:
  atc_network:
    driver: bridge
  infobotit_bot_app_net:
    external: true

volumes:
  postgres_data:
  local_postgres_data:
